events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Client max body size for uploads
    client_max_body_size 5M;

    upstream app_server {
        server app:8000;
    }

    server {
        listen 80;
        server_name apihari.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name apihari.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/apihari.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/apihari.duckdns.org/privkey.pem;

        # SSL optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://app_server/health;
            access_log off;
        }
    }
}
