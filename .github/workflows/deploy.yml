name: CSAT Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run isort --check-only .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # --- CRITICAL FIXES FOR TIMEOUTS ---
          timeout: 60s
          command_timeout: 30m 
          # -----------------------------------
          script: |
            cd ~/CSAT
            git pull origin main
            
            # 1. Build and restart
            # This will take ~15 mins first time, then ~1 min later
            docker compose up -d --build
            
            # 2. Smart Wait for MySQL
            # Instead of a blind sleep, we ensure the app is actually ready
            echo "Waiting for services to stabilize..."
            sleep 10
            
            # 3. Run migrations
            docker compose exec -T app poetry run alembic upgrade head
            
            # 4. DISK MANAGEMENT (Essential for AWS Free Tier)
            # Remove unused images, containers, and networks to keep your 30GB clean
            docker system prune -f
            echo "Deployment Successful!"