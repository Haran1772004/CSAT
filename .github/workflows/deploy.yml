name: CSAT Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run isort --check-only .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/CSAT
            git pull origin main
            
            # Build and restart - Docker will reuse layers to make this fast
            docker compose up -d --build
            
            echo "Waiting for MySQL..."
            sleep 20
            
            # Run migrations
            docker compose exec -T app poetry run alembic upgrade head
            
            # --- SENIOR DEV CLEANUP ---
            # Deletes the old image version so you don't run out of disk space
            docker image prune -f