name: CSAT Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run isort --check-only .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Enter the directory
            cd ~/CSAT
            
            # 2. Pull the latest code (includes your Dockerfile/Compose fixes)
            git pull origin main
            
            # 3. Build and restart in detached mode
            docker compose up -d --build
            
            # 4. Wait for MySQL to finish initializing (prevents Alembic hang)
            echo "Waiting 20 seconds for MySQL to be ready for connections..."
            sleep 20
            
            # 5. Run migrations
            # -T: disables TTY (required for CI/CD)
            # poetry run: ensures correct environment usage
            docker compose exec -T app poetry run alembic upgrade head