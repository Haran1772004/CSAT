version: "3.8"

services:
  app:
    build: .
    container_name: csat_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy # This tells Docker to wait for the healthcheck
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - csat_net

  db:
    image: mysql:8.0
    container_name: csat_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: csat
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword" ]
      timeout: 5s
      retries: 10
      start_period: 10s # Gives MySQL time to boot before checking
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - csat_net
  nginx:
    image: nginx:latest
    container_name: csat_nginx
    restart: always
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - csat_net

volumes:
  db_data:


networks:
  csat_net:
