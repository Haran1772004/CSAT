version: "3.8"

services:
  app:
    build: .
    container_name: csat_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - csat_net

  db:
    image: mysql:8.0
    container_name: csat_db
    # RAM Optimization for AWS Free Tier
    command: --innodb-adaptive-hash-index=0 --innodb-buffer-pool-size=128M --performance_schema=OFF
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}" ]
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - csat_net

  nginx:
    image: nginx:latest
    container_name: csat_nginx
    restart: always
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - csat_net

volumes:
  db_data:


networks:
  csat_net:
